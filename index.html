<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.19.0/dist/axios.min.js"></script>
    <script type="module" src="./JS/main.js" defer></script>
    <title>Document</title>
</head>

<body>
    <header class="flex justify-between items-center bg-white px-8 py-4 shadow-sm">

        <h1 class="text-2xl font-bold text-gray-800">
            FlowBoard
        </h1>
        <button id="add-task" class="bg-blue-600 text-white px-5 py-2 rounded-lg ">
            Nouvelle carte
        </button>
        <form id="task-form"
            class="hidden bg-white shadow-xl rounded-xl p-6 w-full max-w-md mx-auto mt-6 flex-col gap-4">
            <div class="flex flex-col gap-2">
                <label for="title">task title</label>
                <input type="text" id="title" placeholder="enter task title"
                    class="border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex flex-col gap-2">
                <label for="priority">priority</label>

                <select id="priority"
                    class="border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value=""> choisir un priority</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">low</option>
                </select>
            </div>
            <div class="flex flex-col gap-2">
                <label for="status">status</label>
                <select id="status"
                    class="border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">choisir un status</option>
                    <option value="todo">To Do</option>
                    <option value="in-progress">In-Progress</option>
                    <option value="done">Done</option>
                </select>
            </div>
            <div class="flex justify-end gap-3 mt-2">
                <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg "> add task</button>
                <button type="button" id="cancel-task" class="bg-gray-600 text-white px-5 py-2 rounded-lg ">
                    cancel</button>
            </div>
        </form>
    </header>

    <section class="flex flex-col md:flex-row gap-4 p-6">

        <select id="filter-priority" class="border border-gray-300 rounded-lg px-4 py-2 bg-white">
            <option value="">les priorites</option>
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
        </select>

        <select id="assignee" class="border border-gray-300 rounded-lg px-4 py-2 bg-white">
            <option value="">les assignes</option>
        </select>

        <input type="text" id="search" placeholder="Rechercher une tâche..."
            class=" border border-gray-300 rounded-lg px-4 py-2 flex-1">
        <button class="bg-gray-600 text-white px-5 py-2 rounded-lg hover:bg-gray-700">
            Reinitialiser
        </button>
        <div id="err-affichage" class="hidden flex justify-between items-center ">
            <p> something wrong happend</p>
            <button id="try_again" type="button"
                class="bg-gray-600 text-white px-5 py-2 rounded-lg hover:bg-gray-700">ressayer</button>
        </div>
    </section>
    <main class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6">

        <section class="bg-gray-200 rounded-lg p-4">
            <h2 class="text-lg font-bold mb-4">To Do</h2>
            <div id="todo-cards"></div>
        </section>

        <section class="bg-gray-200 rounded-lg p-4">
            <h2 class="text-lg font-bold mb-4">In Progress</h2>
            <div id="progress-cards"></div>
        </section>

        <section class="bg-gray-200 rounded-lg p-4">
            <h2 class="text-lg font-bold mb-4">Done</h2>
            <div id="done-cards"></div>
        </section>

    </main>
    <div id="edit-modal"
        class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-md flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-lg mx-4">
            <h2 class="text-2xl font-bold mb-6">modifier une tache</h2>
            <form id="edit-form" class="flex flex-col gap-4">
                <div>
                    <label for="edit-title" class="block mb-2">title</label>
                    <input type="text" id="edit-title" class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label for="edit-priority" class="block mb-2">priority</label>
                    <select id="edit-priority" class="w-full border rounded-lg p-2">
                        <option value="">choose priority</option>
                        <option value="low">low</option>
                        <option value="medium">medium</option>
                        <option value="high">high</option>
                    </select>
                </div>
                <div>
                    <label for="edit-description" class="block mb-2">description</label>
                    <textarea id="edit-description" rows="4" class="w-full border rounded-lg p-2"
                        placeholder="Enter task description"></textarea>
                </div>
                <div>
                    <label for="edit-status" class="block mb-2">Status</label>
                    <select id="edit-status" class="w-full border rounded-lg p-2">
                        <option value="">Choose status</option>
                        <option value="todo">To do</option>
                        <option value="in-progress">In progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" id="cancel-edit" class="bg-gray-300 px-5 py-2 rounded-lg">
                        Cancel
                    </button>
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
